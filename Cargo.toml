[package]
name = "macdesk"
version = "0.1.0"
edition = "2021"
description = "Reproducible macOS-style desktop transformation for Debian + Cinnamon (WhiteSur/Tahoe GTK/icons/cursors, dark terminal, mac fonts, plank dock)"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
strip = true
